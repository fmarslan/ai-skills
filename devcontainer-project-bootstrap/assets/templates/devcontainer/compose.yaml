services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Containerfile
      args:
        DEV_UID: "1000"
        DEV_GID: "1000"
    user: "1000:1000"
    environment:
      DEV_USERNAME: dev
      DEV_GROUPNAME: dev
      DEV_UID: "1000"
      DEV_GID: "1000"
    volumes:
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-project}:cached
      - codex-home:/home/dev/.codex
    command: sleep infinity

volumes:
  codex-home:
