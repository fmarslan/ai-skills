services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Containerfile
    user: "dev"
    volumes:
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-project}:cached
      - ../data/.codex:/home/dev/.codex:cached
      # Add git credential mounts only when the host paths exist.
    command: sleep infinity
