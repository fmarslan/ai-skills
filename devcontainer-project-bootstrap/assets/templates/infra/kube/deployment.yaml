apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
